name: validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Select Node Version
        uses: svierk/get-node-version@main
      - name: Install Dependencies
        run: npm install --ignore-scripts
      - name: Check Prettier
        run: npm run prettier
      - name: Check ESLint
        run: npm run lint:sonar
      - name: Install SF CLI
        uses: svierk/sfdx-cli-setup@main
        with:
          plugins: "['@salesforce/sfdx-scanner@latest']"
      - name: Run Salesforce Code Analyzer
        id: run-code-analyzer
        uses: forcedotcom/run-code-analyzer@v1
        with:
          run-command: run
          run-arguments: --normalize-severity --target . --outfile results.html
          results-artifact-name: salesforce-code-analyzer-results
      - name: Salesforce Org Login
        uses: svierk/sfdx-login@main
        with:
          client-id: ${{ secrets.SFDX_CONSUMER_KEY }}
          jwt-secret-key: ${{ secrets.SFDX_JWT_SECRET_KEY }}
          username: ${{ vars.SFDX_USERNAME }}
      - name: Deploy Metadata
        uses: svierk/sfdx-deploy@main
      - name: Debug Flow Tests
        run: sf flow run test --test-level RunLocalTests --target-org ${{ vars.SFDX_USERNAME }} --result-format human --json || true
      - name: Run Apex, LWC and Flow Tests
        uses: svierk/sfdx-run-tests@main
        with:
          apex: true
          lwc: true
          flow: true
          target-org: ${{ vars.SFDX_USERNAME }}
          test-level: RunLocalTests
          code-coverage: true
          lwc-test-command: npm run test:unit:coverage
