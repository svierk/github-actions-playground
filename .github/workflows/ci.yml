name: validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Select Node Version
        uses: svierk/get-node-version@main
      - name: Install Dependencies
        run: npm install --ignore-scripts
      - name: Install SF CLI
        uses: svierk/sfdx-cli-setup@main
      - name: Code Review
        id: code-review
        uses: svierk/sfdx-code-review@main
        with:
          code-analyzer: true
          prettier: true
          eslint: true
          workspace: force-app
          config-file: code-analyzer.yml
          prettier-command: npm run prettier
          eslint-command: npm run lint:sonar
      - name: Salesforce Org Login
        uses: svierk/sfdx-login@main
        with:
          client-id: ${{ secrets.SFDX_CONSUMER_KEY }}
          jwt-secret-key: ${{ secrets.SFDX_JWT_SECRET_KEY }}
          username: ${{ vars.SFDX_USERNAME }}
      - name: Deploy Metadata
        uses: svierk/sfdx-deploy@main
      - name: Run Apex, LWC and Flow Tests
        uses: svierk/sfdx-run-tests@main
        with:
          apex: false
          lwc: true
          flow: true
          target-org: ${{ vars.SFDX_USERNAME }}
          test-level: RunLocalTests
          code-coverage: true
          lwc-test-command: npm run test:unit:coverage
